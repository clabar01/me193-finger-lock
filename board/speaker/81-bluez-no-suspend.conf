# ME193 lock: never suspend Bluetooth speaker outputs when idle.
# By default PipeWire suspends an idle output after 5 s, which closes the Bluetooth (A2DP)
# stream; the next sound has to reopen it, and the speaker (JBL Go 4) drops the start of
# that sound while it wakes up: the first digit's beep after the button press was lost.
# With this the stream stays open (sending silence), so every beep plays at once.
# Installed into ~/.config/wireplumber/wireplumber.conf.d/ by pair_speaker.sh.
monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
